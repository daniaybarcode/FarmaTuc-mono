version: "3.9"

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 15+ — Base de datos principal
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: farmatuc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farmatuc}
      POSTGRES_USER: ${POSTGRES_USER:-farmatuc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR: Definí POSTGRES_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: America/Argentina/Tucuman
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmatuc} -d ${POSTGRES_DB:-farmatuc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmatuc-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ──────────────────────────────────────────────
  # API — Node.js + Express + Prisma
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: farmatuc-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmatuc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farmatuc}?schema=public
      PORT: ${API_PORT:-3000}
      TZ: America/Argentina/Tucuman
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - farmatuc-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ──────────────────────────────────────────────
  # Web — Nginx Alpine sirve el frontend built
  # ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: farmatuc-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - farmatuc-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  pgdata:
    driver: local

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  farmatuc-net:
    driver: bridge
